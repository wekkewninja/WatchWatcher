<header class="topbar">
  <mat-toolbar class="brand-toolbar">
    <a class="brand-lockup" routerLink="/" aria-label="WatchWatcher study desk"><span class="brand-mark"><mat-icon>sailing</mat-icon></span><span>WatchWatcher<small>RYA / ASA Yachtmaster</small></span></a>
    <span class="toolbar-spacer"></span>
    @if (auth.user(); as user) {
      <span class="user-name"><span class="user-avatar">{{ user.name.slice(0, 1) }}</span>{{ user.name }}</span>
      <button mat-icon-button (click)="toggleTheme()" [attr.aria-label]="darkMode() ? 'Use light theme' : 'Use dark theme'" [title]="darkMode() ? 'Use light theme' : 'Use dark theme'"><mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon></button>
      <button mat-icon-button (click)="signOut()" aria-label="Sign out" title="Sign out"><mat-icon>logout</mat-icon></button>
    } @else {
      <a mat-stroked-button routerLink="/login"><mat-icon>login</mat-icon> Sign in</a>
    }
  </mat-toolbar>
  @if (auth.user()) {
    <nav class="primary-nav" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><mat-icon>home</mat-icon>Study Desk</a>
      <a routerLink="/examiner" routerLinkActive="active"><mat-icon>radar</mat-icon>Examiner Workspace</a>
      <a routerLink="/exam" routerLinkActive="active"><mat-icon>quiz</mat-icon>Exam</a>
      <a routerLink="/syllabus" routerLinkActive="active"><mat-icon>grid_view</mat-icon>Syllabus Map</a>
      <a routerLink="/colregs" routerLinkActive="active"><mat-icon>search</mat-icon>COLREGs Reference</a>
      <span class="nav-end"><mat-icon>offline_bolt</mat-icon> Offline ready</span>
    </nav>
  }
</header>
<router-outlet />
