openapi: 3.0.3
info:
  title: WatchWatcher API
  version: 1.0.0
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Password:
      type: string
      maxLength: 1024
      description: At most 1,024 Unicode code points and 4,096 UTF-8 bytes; unpaired UTF-16 surrogates are rejected. Registration requires at least 10 Unicode code points, login and linking at least 8, and deletion at least 1. Passwords are UTF-8 encoded exactly as entered, without trimming, case folding, or Unicode normalization.
    CredentialsRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        password: { $ref: '#/components/schemas/Password' }
    RuleExerciseAttempt:
      type: object
      required: [id, ruleId, selectedOptionId, correct, attemptedAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, pattern: '^(rule-(?:[1-9]|[1-3][0-9]|4[01])|annex-(?:i|ii|iii|iv))$' }
        selectedOptionId: { type: string, enum: [a, b, c, d] }
        correct: { type: boolean }
        attemptedAt: { type: string, format: date-time }
    ProgressSnapshot:
      type: object
      required: [topicMastery, weakSpotLog, drillQueue, ruleExerciseAttempts, objectivePracticeAttempts, examSessions, deletedExamSessionIds, examHistoryDeletedAt]
      properties:
        topicMastery:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 100 }
        weakSpotLog:
          type: array
          items:
            type: object
            required: [topicId, tag, timestamp]
            properties:
              topicId: { type: string }
              tag: { type: string }
              timestamp: { type: string, format: date-time }
        drillQueue:
          type: array
          items: { type: string }
        ruleExerciseAttempts:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/RuleExerciseAttempt' }
        objectivePracticeAttempts:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, questionId, topicId, objectiveIds, correct, attemptedAt]
            properties:
              id: { type: string, format: uuid }
              questionId: { type: string, maxLength: 160 }
              topicId: { type: string, maxLength: 120 }
              objectiveIds: { type: array, maxItems: 100, items: { type: string, maxLength: 160 } }
              correct: { type: boolean }
              attemptedAt: { type: string, format: date-time }
        examSessions:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [id, startedAt, completedAt, questionResults, score, passed, criticalGatePassed]
            properties:
              id: { type: string, format: uuid }
              startedAt: { type: string, format: date-time }
              completedAt: { type: string, format: date-time }
              questionResults:
                type: array
                minItems: 1
                maxItems: 250
                items:
                  type: object
                  required: [questionId, topicId, objectiveIds, priority, submittedAnswer, correct]
                  properties:
                    questionId: { type: string, maxLength: 160 }
                    topicId: { type: string, maxLength: 120 }
                    objectiveIds: { type: array, maxItems: 100, items: { type: string, maxLength: 160 } }
                    priority: { type: string, enum: [critical, major, minor] }
                    submittedAnswer: { type: string, maxLength: 12000 }
                    correct: { type: boolean, nullable: true }
              score: { type: number, minimum: 0, maximum: 100 }
              passed: { type: boolean }
              criticalGatePassed: { type: boolean }
        deletedExamSessionIds:
          type: array
          maxItems: 10000
          items: { type: string, format: uuid }
        examHistoryDeletedAt: { type: string, format: date-time, nullable: true }
    ProgressSyncRequest:
      allOf:
        - $ref: '#/components/schemas/ProgressSnapshot'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 0 }
    StoredProgress:
      allOf:
        - $ref: '#/components/schemas/ProgressSnapshot'
        - type: object
          required: [accountId, revision, syncedAt]
          properties:
            accountId: { type: string, format: uuid }
            revision: { type: integer, minimum: 0 }
            syncedAt: { type: string, format: date-time, nullable: true }
    GoogleAuthConfig:
      type: object
      required: [clientId]
      properties:
        clientId: { type: string, description: Public Google OAuth web client ID. }
    GoogleAuthChallenge:
      type: object
      required: [challengeId, nonce, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        nonce: { type: string }
        expiresAt: { type: string, format: date-time }
    GoogleSignInRequest:
      type: object
      required: [credential, challengeId]
      properties:
        credential: { type: string, minLength: 100, maxLength: 10000 }
        challengeId: { type: string, format: uuid }
        linkExisting:
          type: object
          required: [confirmed, password]
          properties:
            confirmed: { type: boolean, enum: [true] }
            password: { $ref: '#/components/schemas/Password' }
    DeleteAccountRequest:
      oneOf:
      - $ref: '#/components/schemas/DeleteAccountWithReauthentication'
      - type: object
        additionalProperties: false
        required: [confirmation, receiptOnly]
        properties:
          confirmation: { type: string, enum: [DELETE] }
          receiptOnly: { type: boolean, enum: [true] }
    DeleteAccountWithReauthentication:
      type: object
      additionalProperties: false
      required: [confirmation, reauthentication]
      properties:
        confirmation: { type: string, enum: [DELETE] }
        reauthentication:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, password]
              properties:
                type: { type: string, enum: [password] }
                password: { $ref: '#/components/schemas/Password' }
            - type: object
              additionalProperties: false
              required: [type, credential, challengeId]
              properties:
                type: { type: string, enum: [google] }
                credential: { type: string, minLength: 100, maxLength: 10000 }
                challengeId: { type: string, format: uuid }
paths:
  /health:
    get:
      summary: Health check for the optional API and service dependencies
      responses:
        '200': { description: Healthy or degraded }
        '503': { description: Unhealthy }
  /auth/register:
    post:
      summary: Create an account and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: Account created }
        '409': { description: Duplicate account }
  /auth/login:
    post:
      summary: Start an authenticated session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialsRequest' }
      responses:
        '200': { description: Session created }
        '401': { description: Invalid credentials }
  /auth/session:
    post:
      summary: Exchange credentials for an account session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialsRequest' }
      responses:
        '200': { description: Session created }
  /auth/google/config:
    get:
      summary: Read public Google sign-in configuration
      responses:
        '200':
          description: Google client configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleAuthConfig' }
        '503': { description: Google sign-in is not configured }
  /auth/google/challenge:
    post:
      summary: Create a short-lived, single-use OIDC nonce challenge
      responses:
        '201':
          description: Google sign-in challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoogleAuthChallenge' }
        '503': { description: Google sign-in is not configured }
  /auth/google:
    post:
      summary: Verify a Google ID token and create a WatchWatcher session or request explicit account linking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleSignInRequest' }
      responses:
        '200': { description: WatchWatcher session created }
        '401': { description: Invalid Google identity, challenge, or existing-account password }
        '409': { description: Explicit account linking required or identity conflict }
        '503': { description: Google sign-in is not configured }
  /auth/me:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read the current user
      responses:
        '200': { description: Current user }
  /auth/logout:
    post:
      security: [{ bearerAuth: [] }]
      summary: Revoke the current session
      description: Requires an unexpired signed bearer token with a session ID. Retrying an already revoked session succeeds. No request body is required.
      responses:
        '204':
          description: Session revoked or already revoked; no response body
          headers:
            Cache-Control:
              description: no-store
              schema: { type: string }
        '401': { description: Invalid, expired, or non-revocable bearer token }
        '503': { description: Session store unavailable }
  /account:
    delete:
      security: [{ bearerAuth: [] }]
      summary: Delete the current account and its server records
      description: Accounts and server records are retained until learner deletion. Deletion is online only and invalidates all sessions. Google reauthentication requires a fresh single-use challenge from /auth/google/challenge. Only the unexpired initiating token can confirm a completed deletion; this receipt cannot authorize other operations. Backup retention is pending legal and operational determination.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteAccountRequest' }
      responses:
        '204': { description: 'Account deleted; no response body' }
        '401': { description: Invalid, revoked or expired bearer session }
        '403': { description: 'Reauthentication failed (REAUTHENTICATION_FAILED)' }
        '422': { description: Invalid request }
        '503': { description: Required service not configured }
  /progress:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read progress for the authenticated account
      responses:
        '200':
          description: Account progress snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoredProgress' }
    put:
      security: [{ bearerAuth: [] }]
      summary: Synchronize local progress with revision checking
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressSyncRequest' }
      responses:
        '200': { description: Progress synchronized }
        '409': { description: Stale revision }
  /exam/evaluate:
    post:
      security: [{ bearerAuth: [] }]
      summary: Evaluate an answer online with explicit consent
      description: Sends only the topic, context, and answer to Google Gemini. Free text is not graded offline. AI judgment is not authoritative navigation guidance. Valid requests count against a proposed 30-per-hour account fixed window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [topicId, context, answer, onlineConsent]
              properties:
                topicId: { type: string, minLength: 1, maxLength: 120 }
                context: { type: string, minLength: 1, maxLength: 10000 }
                answer: { type: string, minLength: 1, maxLength: 12000 }
                onlineConsent: { type: boolean, enum: [true], description: Explicit per-request consent to send the topic, context, and answer to Google. }
      responses:
        '200':
          description: Online evaluation; pass requires the score threshold and criticalFailure false
          content:
            application/json:
              schema:
                type: object
                required: [score, feedback, misconceptionTag, followUpDrill, source, criticalFailure, criticalFailureReason]
                properties:
                  score: { type: number, minimum: 0, maximum: 1 }
                  feedback: { type: string }
                  misconceptionTag: { type: string, nullable: true }
                  followUpDrill: { type: string }
                  source: { type: string, enum: [online] }
                  criticalFailure: { type: boolean }
                  criticalFailureReason: { type: string, nullable: true, description: 'Nonempty for a critical failure; null otherwise.' }
        '401': { description: Authentication required }
        '422': { description: Invalid request or missing consent }
        '429': { description: Account evaluation quota exhausted, headers: { Retry-After: { schema: { type: integer } } } }
        '503': { description: Limiter or online evaluation unavailable, including uncertain or invalid provider judgment }
