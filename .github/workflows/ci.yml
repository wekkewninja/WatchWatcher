name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Install Linux Sass Embedded compiler
        run: |
          sass_version=$(node -p "require('./package-lock.json').packages['services/watchwatcher-web/node_modules/sass-embedded'].version")
          npm install --no-save --package-lock=false --workspace services/watchwatcher-web "sass-embedded-linux-x64@${sass_version}"
      - run: npm run build
      - run: npm test --workspace services/watchwatcher-web
      - run: npm test --workspace services/watchwatcher-api
