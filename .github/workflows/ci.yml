name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Linux Sass Embedded compiler
        run: |
          sass_version=$(node -p "require('./package-lock.json').packages['services/watchwatcher-web/node_modules/sass-embedded'].version")
          npm install --no-save --package-lock=false --workspace services/watchwatcher-web "sass-embedded-linux-x64@${sass_version}"
      - run: npm run build
      - run: npm run test:coverage-gate
      - run: npm run test:coverage
      - run: npm run test:icons
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Report all dependency findings
        if: always()
        continue-on-error: true
        run: npm audit
